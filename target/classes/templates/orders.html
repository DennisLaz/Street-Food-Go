<!DOCTYPE html>
<html
        xmlns:th="https://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{base}">

<head>
    <title>Home</title>
</head>

<body>

<header layout:fragment="header">
    <h1>Orders</h1>
</header>

<section layout:fragment="main">

    <div class="mb-4">
        <a th:href="@{/profile}" th:text="'Logged in as ' + ${me.emailAddress()} + ' (' + ${me.type()} + ')'"></a>
    </div>

    <table class="table mb-4">
        <thead>
            <tr>
                <th>ID</th>
                <th>Status</th>
                <th>Customer</th>
                <th>Restaurant</th>
                <th>Queued</th>
                <th>Started</th>
                <th>Completed</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
        <tr th:each="o : ${orders}">
            <td>
                <a th:href="@{|/orders/${o.orderId()}|}" th:text="${o.orderId()}"></a>
            </td>
            <td th:text="${o.status}"></td>
            <td th:text="${o.customer().username()}"></td>
            <td th:text="${o.restaurant().username()}"></td>
            <td th:text="${o.queuedAt()}"></td>
            <td th:text="${o.inProgressAt()}"></td>
            <td th:text="${o.completedAt()}"></td>
            <!--
            <td>
                <a th:href="@{|/orders/${o.orderId()}|}">View</a>
            </td>
            -->
        </tr>
        </tbody>
    </table>

    <div th:if = "${me.type().name() == 'CUSTOMER'}">
        <a th:href="@{/orders/new}">Open a new Order</a>
    </div>
</section>

</body>
</html>
