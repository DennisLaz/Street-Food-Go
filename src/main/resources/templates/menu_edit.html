<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Edit Menu</title>
</head>
<body>

<h1>Edit Menu</h1>

<form th:action="@{/api/menus/{id}(id=${menu.menuId})}" method="post">
    <input type="hidden" name="_method" value="put"/>

    <label>Title:</label>
    <input type="text" name="title" th:value="${menu.title}"/>

    <label>Active:</label>
    <input type="checkbox" name="active" th:checked="${menu.active}"/>

    <button type="submit">Update</button>
</form>

</body>
</html>
