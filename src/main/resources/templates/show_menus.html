<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Menu</title>
</head>
<body>

<h1 th:text="${menu.title}">Menu</h1>
<h2 th:text="${menu.restaurantName}">Menu</h2>


<ul>
    <li th:each="item : ${menu.items}">
        <strong th:text="${item.name}"></strong>
        - <span th:text="${item.price}"></span> €
        <p th:text="${item.description}"></p>
    </li>
</ul>

</body>
</html>
