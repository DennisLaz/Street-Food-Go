<!DOCTYPE html>
<html   lang="el" xmlns:th="http://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{base}">
<head>
    <title>My Menu</title>
</head>
<body>

<section layout:fragment="main">

<h1>My Menu</h1>

<div th:if="${menu == null}">
    <p>No menu yet.</p>
    <a href="/menus/create">Create Menu</a>
</div>

<div th:if="${menu != null}">
    <h2 th:text="${menu.title}"></h2>

    <ul>
        <li th:each="item : ${menu.items}">
            <span th:text="${item.name}"></span> -
            <span th:text="${item.price}"></span> €
        </li>
    </ul>

    <a th:href="@{/menus/edit/{id}(id=${menu.menuId})}">
        Edit Menu
    </a>
</div>

</section>

</body>
</html>
