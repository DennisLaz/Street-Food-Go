<!DOCTYPE html>
<html
        xmlns:th="https://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        lang="en"
        dir="ltr">
<head>
    <meta charset="UTF-8" />
    <title layout:title-pattern="$CONTENT_TITLE - $LAYOUT_TITLE">
        Street Food Go
    </title>

    <!-- BOOTSTRAP -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- CUSTOM STYLES -->
    <style>
        .app-container {
            margin: 0 auto;
            max-width: 600px;
            box-shadow: 12px 12px 0px black;
            border: 4px solid black !important;
        }
        .form-control, .form-select {
            border: 2px solid #6d6d6d;
            border-radius: 0;
        }
        .form-label {
            text-transform: uppercase;
            margin-bottom: 2px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #7c7c7c;
            font-size: 12px;
        }
        .app-container .btn-primary {
            background: black;
            border: 0;
            padding: 0.5em 4em;
        }
    </style>
</head>
<body>

<header class="p-3 border-bottom" layout:fragment="header">
    <div class="d-flex justify-content-between align-items-center">

        <!-- LEFT ACTIONS -->
        <div class="d-flex gap-2">
            <!-- Home -->
            <a href="/" class="btn btn-outline-dark btn-sm">
                🏠 Home
            </a>

            <!-- Back -->
            <button onclick="history.back()" class="btn btn-outline-dark btn-sm">
                ⬅ Back
            </button>
        </div>

        <!-- RIGHT ACTIONS -->
        <div class="d-flex gap-2">

            <!-- Login (όταν ΔΕΝ είναι συνδεδεμένος) -->
            <a th:if="${#authentication == null || !#authentication.authenticated}"
               href="/login"
               class="btn btn-dark btn-sm">
                Login
            </a>

            <!-- Profile (όταν ΕΙΝΑΙ συνδεδεμένος) -->
            <a th:if="${#authentication != null && #authentication.authenticated}"
               href="/profile"
               class="btn btn-dark btn-sm">
                👤 Profile
            </a>

        </div>

    </div>
</header>


<main class="app-container p-4" layout:fragment="main"></main>

<footer class="text-center p-4 mt-4" layout:fragment="footer">
    <small>&copy; Street Food Go </small>
</footer>
</body>
</html>
