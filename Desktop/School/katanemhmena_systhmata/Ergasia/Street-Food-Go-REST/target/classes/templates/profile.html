<!DOCTYPE html>
<html
        xmlns:th="https://www.thymeleaf.org"
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{base}">

<head>
    <title>Profile</title>
</head>

<body>

<header layout:fragment="header">
    <h1>Office Hours <small>/ Profile</small></h1>
</header>

<section layout:fragment="main">

    <div>
        <ul>
            <li>Username <span th:text="${me.username()}"></span></li>
            <li>Email <span th:text="${me.emailAddress()}"></span></li>
            <li>Type <span  th:text="${me.type()}"></span></li>
        </ul>

        <hr>

        <ul>
            <li>
                <a th:href="@{/}">Home</a>
            </li>
            <li>
                <a th:href="@{/logout}">Logout</a>
            </li>
            <!-- CUSTOMER CTA -->
            <li th:if="${me != null and me.type.name() == 'CUSTOMER'}">
                <a th:href="@{/restaurants}" class="menu-btn">
                    Browse Restaurants
                </a>
            </li>

            <!-- RESTAURANT CTA -->
            <li th:if="${me != null and me.type.name() == 'RESTAURANT'}">
                <a th:href="@{/orders}" class="menu-btn">
                    View Incoming Orders
                </a>
            </li>

        </ul>
    </div>



</section>

</body>
</html>
